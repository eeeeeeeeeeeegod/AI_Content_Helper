<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        登入 - AI 智慧圖文小幫手
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container">


    <h1>
        ✨ AI 智慧圖文小幫手
    </h1>


    <p class="description">
        登入後開始創作你的 AI 圖文內容
    </p>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="請輸入 Email"
            required
        >


        <label>
            密碼
        </label>

        <input
            type="password"
            name="password"
            placeholder="請輸入密碼"
            required
        >


        <button type="submit">

            登入

        </button>


    </form>


    <p class="auth-footer">

        還沒有帳號嗎？

        <a href="{{ url_for('register') }}">

            建立帳號

        </a>

    </p>


</div>


</body>

</html>
